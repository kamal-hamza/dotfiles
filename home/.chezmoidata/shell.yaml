# =============================================================================
# Shell environment - single source for every shell
# =============================================================================
# Rendered into:
#   fish (macOS/Linux): dot_config/fish/conf.d/10-env.fish.tmpl, 30-aliases.fish.tmpl
#   PowerShell (Windows): Documents/PowerShell/Microsoft.PowerShell_profile.ps1.tmpl
#
# env / path:  `common` applies everywhere, then the current OS's block is
#              layered on top. Values are rendered inside double quotes, so
#              `$HOME` expands in both fish and PowerShell.
# aliases:     `cmd` is what the alias runs. If it contains {args}, it becomes a
#              function with the arguments substituted there (fish $argv,
#              PowerShell @args); otherwise it's a fish abbreviation /
#              PowerShell function that appends the arguments.
#              `os` (optional) limits an alias to those OSes - most point at
#              Unix-only tools or the bash scripts in ~/.local/bin.
#
# Every user-invocable script in dot_local/bin should get an alias here.
# GUI-session env vars belong in the compositor (dot_config/hypr/conf/envs.lua),
# not here - shells don't reach apps launched from the desktop.
# =============================================================================
shell:
  os_unix: &unix [darwin, linux] # anchor: `os: *unix` below

  env:
    common:
      EDITOR: zed
      VISUAL: zed
      FZF_DEFAULT_OPTS: "--color=bw --border=rounded --height=40% --reverse --cycle --bind='tab:down,shift-tab:up'"
    darwin: {}
    linux:
      FZF_DEFAULT_COMMAND: "find . -type f 2>/dev/null"
      FZF_CTRL_T_COMMAND: "find . -type f 2>/dev/null"
      LIBCLANG_PATH: /usr/lib/
      SDL_VIDEODRIVER: wayland,x11 # Better SDL game compatibility on Wayland
      MOZ_ENABLE_WAYLAND: "1" # Native Wayland for Firefox-based apps
      ELECTRON_OZONE_PLATFORM_HINT: auto # Wayland support in Electron apps
    windows: {}

  path: # prepended in this order; directories that don't exist are skipped
    common:
      - $HOME/.local/bin
      - $HOME/.cargo/bin
      - $HOME/.bun/bin
    darwin: []
    linux: []
    windows: []

  aliases:
    # --- editors / basics
    - { name: v, cmd: nvim }
    - { name: vi, cmd: nvim }
    - { name: c, cmd: clear }
    - { name: cls, cmd: clear, os: *unix }

    # --- git
    - { name: g, cmd: git }
    - { name: gs, cmd: git status }
    - { name: ga, cmd: git add }
    - { name: gaa, cmd: git add --all }
    - { name: gc, cmd: git commit }
    - { name: gcm, cmd: git commit -m }
    - { name: gp, cmd: git push }
    - { name: gpl, cmd: git pull }
    - { name: gd, cmd: git diff }
    - { name: gds, cmd: git diff --staged }
    - { name: gl, cmd: git log --oneline --graph --decorate }
    - { name: gco, cmd: git checkout }
    - { name: gcb, cmd: git checkout -b }
    - { name: gb, cmd: git branch }
    - { name: gba, cmd: git branch -a }
    - { name: gm, cmd: git merge }
    - { name: gr, cmd: git rebase }
    - { name: gst, cmd: git stash }
    - { name: gstp, cmd: git stash pop }

    # --- file listing (BSD ls on macOS, GNU ls on Linux)
    - { name: l, cmd: ls -lh, os: *unix }
    - { name: la, cmd: ls -lAh, os: *unix }
    - { name: ll, cmd: ls -lh, os: *unix }
    - { name: lt, cmd: ls -lhtr, os: *unix }
    - { name: lsize, cmd: ls -lhS, os: *unix }

    # --- navigation (fish already cds when you type `..` or `~`)
    - { name: ..., cmd: cd ../.., os: *unix }
    - { name: ...., cmd: cd ../../.., os: *unix }

    # --- utilities
    - { name: ports, cmd: netstat -tulanp, os: [linux] }
    - { name: mkdir, cmd: mkdir -pv, os: *unix }
    - { name: df, cmd: df -h, os: *unix }
    - { name: du, cmd: du -h, os: *unix }
    - { name: free, cmd: free -h, os: [linux] }

    # --- taskwarrior
    - { name: tT, cmd: task, os: *unix }
    - { name: ta, cmd: task add, os: *unix }
    - { name: tls, cmd: task list, os: *unix }
    - { name: tnx, cmd: task next, os: *unix }
    - { name: trd, cmd: task ready, os: *unix }
    - { name: tov, cmd: task overdue, os: *unix }
    - { name: tact, cmd: task active, os: *unix }
    - { name: tall, cmd: task all, os: *unix }
    - { name: trec, cmd: task recurring, os: *unix }
    - { name: twait, cmd: task waiting, os: *unix }
    - { name: tblk, cmd: task blocked, os: *unix }
    - { name: tblkg, cmd: task blocking, os: *unix }
    - { name: tcmp, cmd: task completed, os: *unix }
    - { name: tcon, cmd: task context, os: *unix }
    - { name: tconn, cmd: task context none, os: *unix }
    - { name: tprj, cmd: task projects, os: *unix }
    - { name: ttag, cmd: task tags, os: *unix }
    - { name: tsum, cmd: task summary, os: *unix }
    - { name: tstat, cmd: task stats, os: *unix }
    - { name: tcal, cmd: task calendar, os: *unix }
    - { name: tburn, cmd: task burndown, os: *unix }
    - { name: tinf, cmd: task information, os: *unix }
    - { name: tw, cmd: task +work, os: *unix }
    - { name: tper, cmd: task +personal, os: *unix }
    - { name: ttdy, cmd: task +today, os: *unix }
    # ID-based: td 1 / td 1-3 / td 1,2,3
    - { name: td, cmd: "task {args} done", os: *unix }
    - { name: ts, cmd: "task {args} start", os: *unix }
    - { name: tsp, cmd: "task {args} stop", os: *unix }
    - { name: tm, cmd: "task {args} modify", os: *unix }
    - { name: tx, cmd: "task {args} delete", os: *unix }
    - { name: tdup, cmd: "task {args} duplicate", os: *unix }
    - { name: te, cmd: "task {args} edit", os: *unix }
    - { name: tapp, cmd: "task {args} append", os: *unix }
    - { name: tprep, cmd: "task {args} prepend", os: *unix }
    - { name: tann, cmd: "task {args} annotate", os: *unix }
    - { name: tden, cmd: "task {args} denotate", os: *unix }
    - { name: tph, cmd: "task {args} modify priority:H", os: *unix }
    - { name: tpm, cmd: "task {args} modify priority:M", os: *unix }
    - { name: tpl, cmd: "task {args} modify priority:L", os: *unix }
    - { name: tpn, cmd: "task {args} modify priority:", os: *unix }

    # --- ~/.local/bin scripts
    - { name: mi, cmd: music-import, os: [linux] } # import new FLACs from the dropzone
    - { name: mia, cmd: music-import --asis, os: [linux] } # organize hand-tagged files, no MusicBrainz search
    - { name: ml, cmd: music-lyrics, os: [linux] } # backfill .lrc lyrics
    - { name: ms, cmd: music-sync, os: [linux] } # refresh beets DB + repair MPD playlists
    - { name: itool, cmd: install-lang, os: *unix }
    - { name: ccp, cmd: create-project, os: *unix }
    - { name: dcp, cmd: delete-project, os: *unix }
    - { name: tt, cmd: tmux-new, os: *unix }
    - { name: t, cmd: tmux a, os: *unix }
    - { name: dr, cmd: docker-run, os: *unix }
    - { name: ds, cmd: docker-stop, os: *unix }
    - { name: m, cmd: man-tldr, os: *unix }
    - { name: font, cmd: font-switcher, os: *unix }
