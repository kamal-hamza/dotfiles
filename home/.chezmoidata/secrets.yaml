# =============================================================================
# Secrets from Bitwarden
# =============================================================================
# Each entry becomes `set -gx NAME '<value>'` in
# ~/.config/fish/conf.d/40-secrets.fish (mode 0600), rendered from
# dot_config/fish/conf.d/private_40-secrets.fish.tmpl. Values never touch the
# repo - only the vault item names below do.
#
#   name:  environment variable to set
#   item:  Bitwarden item name (or id)
#   field: custom field on that item; omit to use the item's login password
#
# Rendered only while the vault is unlocked (BW_SESSION set - run `bwu`);
# otherwise chezmoi skips the file and leaves the existing one alone.
# After editing: `bwu; and chezmoi apply`.
# =============================================================================
secrets:
  # SSH private keys: ~/.ssh/<file> <- notes of a Bitwarden secure note,
  # stored verbatim (still passphrase-protected, so GNOME Keyring's agent
  # unlocks them with the passphrase it saved). Each needs a matching
  # home/private_dot_ssh/private_<file>.tmpl; the .pub files are plain repo files.
  ssh_keys:
    id_ed25519: ssh-github
    id_ed25519_gitlab: ssh-gitlab

  env: []
  # - { name: ANTHROPIC_API_KEY, item: anthropic }
  # - { name: OPENAI_API_KEY, item: openai, field: api_key }
