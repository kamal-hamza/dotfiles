# Minimalist Ly Configuration for Wayland / Hyprland
# Note: Animations and extra UI elements are disabled for maximum minimalism.

# Allow empty password or not when authenticating
allow_empty_password = true

# The active animation
animation = none

# The character used to mask the password
asterisk = *

# Background color id 
bg = 0x00050505

# Change the state and language of the big clock
bigclock = none

# Blank main box background
blank_box = true

# Border foreground color id (Obsidian fg: #d4d4d4) - Not visible since borders are hidden, but kept for fallback
border_fg = 0x00d4d4d4

# Title to show at the top of the main box
box_title = null

# Erase password input on failure
clear_password = true

# Format string for clock in top right corner
clock = null

# Input box active by default on startup
default_input = login

# Error background color id
error_bg = 0x00050505

# Error foreground color id (Obsidian danger: #ff7676, bold)
error_fg = 0x01ff7676

# Foreground color id (Obsidian fg: #d4d4d4)
fg = 0x00d4d4d4

# Render true colors
full_color = true

# Remove main box borders for minimalism
hide_borders = true

# Remove power management command hints
hide_key_hints = true

# Remove keyboard lock states from the top right corner
hide_keyboard_locks = true

# Remove version number from the top left corner
hide_version_string = true

# Initial text to show on the info line
initial_info_text = null

# Active language
lang = en

# Main box horizontal margin
margin_box_h = 2

# Main box vertical margin
margin_box_v = 1

# Default path
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Save the current desktop and login as defaults, and load them on startup
save = true

# Service name
service_name = ly

# Show the shell session in the session list
shell = false

# Display the active TTY number
show_tty = false

# Center the session name.
text_in_center = true

# Wayland desktop environments (Where Hyprland places its .desktop file)
waylandsessions = /usr/share/wayland-sessions

# Xorg desktop environments (Hidden to favor Wayland, or leave default if you still use X11)
xsessions = /usr/share/xsessions
